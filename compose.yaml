services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inheria
      POSTGRES_USER: inheria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - inheria-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inheria -d inheria"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      INHERIA_ENVIRONMENT: production
      INHERIA_DEMO_MODE: "false"
      INHERIA_DATABASE_URL: ${INHERIA_DATABASE_URL:?Set the PostgreSQL URL with a URL-encoded password and db host}
      INHERIA_ALLOWED_ORIGINS: ${INHERIA_ALLOWED_ORIGINS:?Set the JSON array of permitted HTTPS origins}
      INHERIA_TOKEN_ENCRYPTION_KEY: ${INHERIA_TOKEN_ENCRYPTION_KEY:-}
      INHERIA_LLM_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
volumes:
  inheria-postgres:
