services:
  - type: web
    name: inheria
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: INHERIA_ENVIRONMENT
        value: production
      - key: INHERIA_DEMO_MODE
        value: "false"
      - key: INHERIA_JUDGE_DEMO_ENABLED
        value: "true"
      - key: INHERIA_JUDGE_DEMO_HOURS
        value: "4"
      - key: INHERIA_JUDGE_DEMO_MAX_VISITS
        value: "40"
      - key: INHERIA_LLM_ENABLED
        value: "false"
      - key: INHERIA_DATABASE_URL
        sync: false
      - key: INHERIA_TOKEN_ENCRYPTION_KEY
        sync: false
