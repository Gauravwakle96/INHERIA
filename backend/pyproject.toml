[project]
name = "inheria-backend"
version = "0.1.0"
description = "Evidence-driven technical knowledge continuity platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1", "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3", "argon2-cffi>=23.1",
  "httpx>=0.28,<1", "python-multipart>=0.0.20",
  "pymupdf>=1.25", "python-docx>=1.1,<2", "cryptography>=44",
  "psycopg[binary]>=3.2,<4", "email-validator>=2.2,<3"
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.9", "pip-audit>=2.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
